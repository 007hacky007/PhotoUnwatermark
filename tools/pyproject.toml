[project]
name = "puw-tools"
version = "0.1.0"
description = "PhotoUnwatermark developer tooling (not a package)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pillow",
    "scikit-image",
    "pytest",
    "torch>=2.15.0",
    "segmentation-models-pytorch>=0.6.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "onnxconverter-common>=1.16.0",
    "huggingface-hub>=2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["synth"]
