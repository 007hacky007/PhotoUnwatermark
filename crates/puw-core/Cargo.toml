[package]
name = "puw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
imageproc = { version = "0.27", default-features = false }
img-parts = "0.4"
kamadak-exif = "0.6"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tiff = "0.11"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[dev-dependencies]
jpeg-encoder = "0.6"
tempfile = "3"
