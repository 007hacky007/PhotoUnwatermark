[package]
name = "puw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
