name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks on every push: formatting, lints, the UI tests and every Rust test that needs
  # no model files (the model-backed tests skip themselves without PUW_MODELS_DIR).
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app check
      - run: pnpm -C app test
      # The Tauri crate embeds app/dist, so the cargo steps need it built.
      - run: pnpm -C app build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  # The tests that run the real models. They take about 30 minutes on a Windows runner and
  # much longer on a macOS runner (no Neural Engine there), so they run on Windows only, on
  # pushes to master and on request; on the Mac they run locally with Core ML.
  models:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: windows-latest
    env:
      PUW_MODELS_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ runner.os }}
      - name: Fetch models
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/fetch-models.ps1
      - run: cargo test --workspace --release

  # The portable Windows app for manual testing, on request only. It does not wait for the
  # tests, so it is ready in minutes.
  windows-exe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Windows app (no installer)
        run: pnpm -C app tauri build --no-bundle
      - name: Upload the Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: photounwatermark-windows-exe
          path: target/release/photounwatermark.exe
          if-no-files-found: error
