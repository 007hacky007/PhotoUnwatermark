name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUW_MODELS_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1-${{ runner.os }}
      - name: Fetch models (macOS)
        if: steps.models-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: scripts/fetch-models.sh
      - name: Fetch models (Windows)
        if: steps.models-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: scripts/fetch-models.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
