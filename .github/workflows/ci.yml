name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUW_MODELS_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app check
      - run: pnpm -C app test
      # The Tauri crate embeds app/dist, so the cargo steps need it built.
      - run: pnpm -C app build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ runner.os }}
      - name: Fetch models (macOS)
        if: steps.models-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: scripts/fetch-models.sh
      - name: Fetch models (Windows)
        if: steps.models-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: scripts/fetch-models.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - name: Build the Windows app (no installer)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: pnpm -C app tauri build --no-bundle
      - name: Upload the Windows exe
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: photounwatermark-windows-exe
          path: target/release/photounwatermark.exe
          if-no-files-found: error
